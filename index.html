<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Man and Women</title>
    <style>
        /* Estilos generales con los colores del logo */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0b1e3b; /* Azul profundo del logo */
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Logo de fondo con 50% de opacidad */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('Logo Circular.jpeg'); /* Asegúrate que el archivo esté en la misma carpeta */
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.5; /* Opacidad solicitada */
            z-index: -1;
        }

        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px;
            border: 2px solid #c5a059; /* Borde dorado */
        }

        h2 { 
            color: #0b1e3b; 
            text-align: center; 
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label { 
            display: block; 
            margin: 15px 0 5px; 
            font-weight: bold; 
            color: #333;
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }

        button { 
            background-color: #c5a059; /* Dorado del logo */
            color: #0b1e3b; /* Texto en azul oscuro para contraste */
            border: none; 
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 20px;
            transition: background 0.3s;
        }

        button:hover { 
            background-color: #e2c07d; /* Dorado más claro al pasar el mouse */
        }

        .brand-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #c5a059;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Agendar Cita</h2>
    <form id="reservationForm">
        <label>Nombre del Cliente:</label>
        <input type="text" id="name" placeholder="Escribe tu nombre" required>

        <label>Servicio Estético:</label>
        <select id="service">
            <option value="Barbería/Corte">Barbería / Corte</option>
            <option value="Estética Facial">Estética Facial</option>
            <option value="Manicura/Pedicura">Manicura / Pedicura</option>
            <option value="Tratamiento Corporal">Tratamiento Corporal</option>
        </select>

        <label>Fecha de la Cita:</label>
        <input type="date" id="date" required>

        <label>Hora:</label>
        <input type="time" id="time" required>

        <button type="button" onclick="sendToWhatsApp()">RESERVAR POR WHATSAPP</button>
    </form>
    <div class="brand-footer">CENTRO ESTÉTICO MAN AND WOMEN</div>
</div>

<script>
    function sendToWhatsApp() {
        const phone = "573104073119"; // Número actualizado
        const name = document.getElementById('name').value;
        const service = document.getElementById('service').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;

        if(!name || !date || !time) {
            alert("Por favor, llena todos los datos para tu reserva.");
            return;
        }

        // Estructura del mensaje para WhatsApp
        const message = `*NUEVA RESERVA - MAN AND WOMEN*%0A%0A` +
                        `*Cliente:* ${name}%0A` +
                        `*Servicio:* ${service}%0A` +
                        `*Fecha:* ${date}%0A` +
                        `*Hora:* ${time}%0A%0A` +
                        `Favor confirmar disponibilidad.`;

        const whatsappURL = `https://wa.me/${phone}?text=${message}`;
        
        window.open(whatsappURL, '_blank');
    }
</script>

</body>
</html>
