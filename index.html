<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Reservas - Man and Women">
<meta property="og:description" content="Agenda tu cita en nuestro centro estético de forma rápida y sencilla.">
<meta property="og:image" content="https://manandwomen2026.github.io/reservas/Logo%20Circular.jpeg">
<meta property="og:url" content="https://manandwomen2026.github.io/reservas/">
<meta property="og:type" content="website">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Man and Women</title>
    <style>
        /* Fondo principal liso para mayor limpieza */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0b1e3b; /* Azul profundo del logo */
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* La tarjeta blanca mejorada con el logo dentro */
        .card { 
            /* Fondo: Primero un degradado blanco transparente, luego el logo */
            background-image: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), url('Logo Circular.jpeg'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain; /* El logo se adapta perfectamente dentro de la tarjeta */
            background-attachment: initial; /* Asegura que el logo no se mueva al hacer scroll */

            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            width: 100%; 
            max-width: 400px;
            border: 2px solid #c5a059; /* Borde dorado corporativo */
            position: relative;
            z-index: 1; /* Asegura que la tarjeta esté sobre el fondo liso */
        }

        h2 { 
            color: #0b1e3b; /* Azul para el título */
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        label { 
            display: block; 
            margin: 15px 0 6px; 
            font-weight: bold; 
            color: #222; /* Un gris oscuro para buena lectura */
            font-size: 14px;
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            background-color: rgba(255,255,255,0.9); /* Ligeramente opaco para ver el logo detrás */
            font-size: 14px;
            color: #333;
        }

        button { 
            background-color: #c5a059; /* Dorado del logo */
            color: #0b1e3b; /* Texto azul oscuro */
            border: none; 
            padding: 16px;
            width: 100%;
            border-radius: 8px;
            font-weight: 800; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:hover { 
            background-color: #e2c07d; /* Dorado más claro */
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .brand-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #c5a059; /* Dorado */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Agendar Cita</h2>
    <form id="reservationForm">
        <label>Nombre del Cliente:</label>
        <input type="text" id="name" placeholder="Tu nombre completo" required>

        <label>¿Qué servicio buscas?</label>
        <select id="service">
            <option value="Barbero">Barbero</option>
            <option value="Estilista">Estilista</option>
            <option value="Manicurista">Manicurista</option>
        </select>

        <label>¿Quién quieres que te atienda?</label>
        <select id="professional">
            <option value="Cualquier profesional disponible">Cualquier profesional</option>
            <option value="Profesional 1">Adriana</option>
            <option value="Profesional 2">Rochy</option>
            <option value="Profesional 2">Anyela</option>
        </select>

        <label>Fecha de la Cita:</label>
        <input type="date" id="date" required>

        <label>Hora de la Cita (9am - 6pm):</label>
        <select id="time" required>
            <option value="" disabled selected>Selecciona una hora</option>
            <option value="09:00 AM">09:00 AM</option>
            <option value="09:30 AM">09:30 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="10:30 AM">10:30 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="11:30 AM">11:30 AM</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="12:30 PM">12:30 PM</option>
            <option value="01:00 PM">01:00 PM</option>
            <option value="01:30 PM">01:30 PM</option>
            <option value="02:00 PM">02:00 PM</option>
            <option value="02:30 PM">02:30 PM</option>
            <option value="03:00 PM">03:00 PM</option>
            <option value="03:30 PM">03:30 PM</option>
            <option value="04:00 PM">04:00 PM</option>
            <option value="04:30 PM">04:30 PM</option>
            <option value="05:00 PM">05:00 PM</option>
            <option value="05:30 PM">05:30 PM</option>
            <option value="06:00 PM">06:00 PM</option>
        </select>

        <button type="button" onclick="sendToWhatsApp()">RESERVAR POR WHATSAPP</button>
    </form>
    <div class="brand-footer">CENTRO ESTÉTICO MAN AND WOMEN</div>
</div>

<script>
    function sendToWhatsApp() {
        const phone = "573104073119"; 
        const name = document.getElementById('name').value;
        const service = document.getElementById('service').value;
        const professional = document.getElementById('professional').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;

        if(!name || !date || !time) {
            alert("Por favor, llena todos los campos para agendar tu cita.");
            return;
        }

        const message = `*NUEVA RESERVA - MAN AND WOMEN*%0A%0A` +
                        `*Cliente:* ${name}%0A` +
                        `*Servicio:* ${service}%0A` +
                        `*Profesional:* ${professional}%0A` +
                        `*Fecha:* ${date}%0A` +
                        `*Hora:* ${time}%0A%0A` +
                        `Favor confirmar disponibilidad.`;

        const whatsappURL = `https://wa.me/${phone}?text=${message}`;
        
        window.open(whatsappURL, '_blank');
    }
</script>

</body>
</html>
