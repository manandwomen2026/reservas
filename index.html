<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Citas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #25D366; text-align: center; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #25D366; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #128C7E; }
    </style>
</head>
<body>

<div class="card">
    <h2>Reservar Cita</h2>
    <form id="reservationForm">
        <label>Nombre Completo:</label>
        <input type="text" id="name" placeholder="Ej. Juan Pérez" required>

        <label>Servicio:</label>
        <select id="service">
            <option value="Corte de Cabello">Corte de Cabello</option>
            <option value="Barba">Barba</option>
            <option value="Manicura">Manicura</option>
            <option value="Combo Completo">Combo Completo</option>
        </select>

        <label>Fecha:</label>
        <input type="date" id="date" required>

        <label>Hora:</label>
        <input type="time" id="time" required>

        <button type="button" onclick="sendToWhatsApp()">Agendar por WhatsApp</button>
    </form>
</div>

<script>
    function sendToWhatsApp() {
        const phone = "573000000000"; // SUSTITUYE CON TU NÚMERO (Código de país + número)
        const name = document.getElementById('name').value;
        const service = document.getElementById('service').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;

        if(!name || !date || !time) {
            alert("Por favor, completa todos los campos.");
            return;
        }

        const message = `Hola, quiero agendar una cita:%0A%0A` +
                        `*Nombre:* ${name}%0A` +
                        `*Servicio:* ${service}%0A` +
                        `*Fecha:* ${date}%0A` +
                        `*Hora:* ${time}`;

        const whatsappURL = `https://wa.me/${phone}?text=${message}`;
        
        window.open(whatsappURL, '_blank');
    }
</script>

</body>
</html>
